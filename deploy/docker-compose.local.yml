services:
  postgres:
    image: postgres:16-alpine
    container_name: kuula-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuula
      POSTGRES_PASSWORD: kuula_local_password
      POSTGRES_DB: kuula_local
    ports:
      - "5433:5432"
    volumes:
      - kuula_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuula -d kuula_local"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  kuula_local_pgdata:
