project_id = "kuula"

[functions.credit-score]
verify_jwt = true

[functions.auto-collect]
# Privileged scheduler — invoked by cron with the service role, not end users.
verify_jwt = false

# Run the auto-collection sweep hourly. (Also schedulable via pg_cron calling
# net.http_post to the function URL.)
[functions.auto-collect.schedule]
cron = "0 * * * *"

# ── MarzPay real-money functions ────────────────────────────────────────────
# Admin sends the loan principal to the borrower's mobile money, then books it.
[functions.marzpay-disburse]
verify_jwt = true

# Authenticated customer starts a repayment collection (request-to-pay).
[functions.marzpay-collect]
verify_jwt = true

# Public callback from MarzPay — no Supabase JWT. Protected by a shared
# token (MARZPAY_WEBHOOK_SECRET) checked inside the function.
[functions.marzpay-webhook]
verify_jwt = false
