name: Azure Deploy

# Deploys the full Kuula stack to Azure:
#   Frontend → Azure Static Web Apps (or Azure Blob + CDN)
#   Backend  → Azure Container Apps (ACA)
#
# Triggers on push to main or manual dispatch.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (staging or production)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      deploy_frontend:
        description: "Deploy frontend web assets"
        required: false
        default: true
        type: boolean
      deploy_backend:
        description: "Deploy backend API"
        required: false
        default: true
        type: boolean

concurrency:
  group: azure-deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: kuula-rg-${{ github.event.inputs.environment || 'staging' }}
  AZURE_LOCATION: eastafrica  # East Africa region for Uganda market
  BACKEND_IMAGE: kuula-api

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend: build web assets + deploy to Azure Static Web Apps / Blob
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    if: github.event.inputs.deploy_frontend != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_PROD }}
          VITE_USE_API: "true"
          VITE_APP_ENV: production

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

      # ── Deploy to Azure Container Apps (frontend served via backend) ──────────
      # If using Azure Static Web Apps instead, replace with:
      #   uses: azure/static-web-apps-deploy@v1
      - name: Azure Login
        if: github.event.inputs.environment == 'production'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Blob Storage (CDN-backed)
        if: github.event.inputs.environment == 'production'
        uses: azure/cli@v2
        with:
          inlineScript: |
            STORAGE_ACCOUNT="kuula${{ github.event.inputs.environment }}"
            az storage blob upload-batch \
              --destination '$web' \
              --source dist/ \
              --account-name "$STORAGE_ACCOUNT" \
              --auth-mode login \
              --overwrite \
              --content-cache-control "public, max-age=31536000, immutable"

      - name: Purge Azure CDN
        if: github.event.inputs.environment == 'production'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az cdn endpoint purge \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --profile-name kuula-cdn \
              --name kuula-${{ github.event.inputs.environment }} \
              --content-paths "/*"

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend: build Docker image + push to Azure Container Registry + deploy ACA
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    if: github.event.inputs.deploy_backend != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name kuulacregistry

      - name: Build and push backend image to ACR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            kuulacregistry.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            kuulacregistry.azurecr.io/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy@v1
        with:
          acrCredentials: |
            {
              "server": "kuulacregistry.azurecr.io",
              "username": ${{ secrets.ACR_USERNAME }},
              "password": ${{ secrets.ACR_PASSWORD }}
            }
          containerAppName: kuula-api-${{ github.event.inputs.environment || 'staging' }}
          imageToDeploy: kuulacregistry.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Verify health
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          URL="https://api-${ENV}.kuula.ug"
          for i in $(seq 1 30); do
            if curl -sf "$URL/api/health" | grep -q '"ok":true'; then
              echo "Azure health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 150s"
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Mobile builds (Android + iOS) for Azure-hosted API
  # ─────────────────────────────────────────────────────────────────────────────
  mobile:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (Azure API endpoint)
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_PROD }}
          VITE_USE_API: "true"
          VITE_APP_ENV: production

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android AAB
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_KUULA_RELEASE_STORE_FILE: ${{ github.workspace }}/android/app/kuula-release.keystore
          ORG_GRADLE_PROJECT_KUULA_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KUULA_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KUULA_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/kuula-release.keystore
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-azure-deploy
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
