name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Pricing compliance
        run: npm run check:pricing

      - name: Guarded production build
        run: npm run build
        env:
          VITE_BACKEND: node
          VITE_USE_API: "true"
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_ENV: production
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_ENABLE_BIOMETRIC: "true"
          VITE_ENABLE_SAVINGS: "true"
          VITE_REVIEWER_MODE: "false"

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The route sweep intentionally runs in local demo mode. It checks every
      # registered screen for runtime crashes and blank renders; API behavior is
      # tested separately against PostgreSQL in the server job.
      - name: Route sweep
        run: |
          npm run dev -- --port 5173 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:5173/ > /dev/null && break
            sleep 0.5
          done
          npm run sweep

  server:
    name: Node API + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kuula
          POSTGRES_PASSWORD: kuula
          POSTGRES_DB: kuula_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuula -d kuula_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://kuula:kuula@localhost:5432/kuula_test?schema=public
      JWT_SECRET: ci-test-secret-at-least-64-characters-long-for-kuula-api
      NODE_ENV: test
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173
      ADMIN_EMAIL: admin-ci@kuula.test
      ADMIN_PASSWORD: Admin-CI-Password-Only-2026
      DEMO_PHONE: "+256700000000"
      DEMO_PASSWORD: "12345678"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Build API
        working-directory: server
        run: npm run build

      - name: Apply PostgreSQL migrations
        working-directory: server
        run: npm run db:migrate:deploy

      - name: Seed isolated CI database
        working-directory: server
        run: npm run db:seed

      - name: API smoke tests
        working-directory: server
        run: |
          npm start &
          API_PID=$!
          trap 'kill $API_PID' EXIT

          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              ready=true
              break
            fi
            sleep 0.5
          done
          test "$ready" = "true"

          curl -sf http://localhost:3000/api/health | grep -q '"ok":true'

          curl -sf -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"phone":"+256700000000","pin":"12345678"}' | grep -q '"token"'

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"phone":"+256700000000","pin":"wrong-password"}')
          test "$code" = "401"

  capacitor-sync:
    name: Capacitor Sync
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download verified web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Sync native projects
        run: npx cap sync android && npx cap sync ios
