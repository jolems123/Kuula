name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_RESOLUTION_BEFORE: 2026-08-23T00:00:00.000Z

jobs:
  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.2 && test "$(npm --version)" = "10.9.2"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Resolve Pact workspace deterministically
        working-directory: pact
        env:
          PACT_DO_NOT_TRACK: "1"
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install Pact contract workspace from resolved lock
        working-directory: pact
        env:
          PACT_DO_NOT_TRACK: "1"
        run: npm ci --no-audit --no-fund
      - name: Pact consumer contracts
        working-directory: pact
        env:
          PACT_DO_NOT_TRACK: "1"
        run: npm test
      - name: Upload resolved Pact lock
        uses: actions/upload-artifact@v4
        with:
          name: pact-resolved-lock
          path: pact/package-lock.json
          retention-days: 14
      - name: Pricing compliance
        run: npm run check:pricing
      - name: Client-server pricing parity
        run: npm run check:pricing-parity
      - name: Guarded production build
        run: npm run build
        env:
          VITE_BACKEND: node
          VITE_USE_API: "true"
          VITE_API_BASE_URL: https://api-ci.kuula.invalid
          VITE_APP_ENV: production
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_ENABLE_BIOMETRIC: "true"
          VITE_REVIEWER_MODE: "false"
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7
      - name: Upload Pact contracts
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: pact/pacts/
          retention-days: 14
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Route sweep
        run: |
          npm run dev -- --port 5173 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:5173/ > /dev/null && break
            sleep 0.5
          done
          npm run sweep

  server:
    name: Node API + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kuula
          POSTGRES_PASSWORD: kuula
          POSTGRES_DB: kuula_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kuula -d kuula_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://kuula:kuula@localhost:5432/kuula_test?schema=public
      JWT_SECRET: ci-test-secret-at-least-64-characters-long-for-kuula-api
      OTP_PEPPER: ci-only-otp-pepper-at-least-32-characters
      NODE_ENV: test
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173
      PUBLIC_API_URL: http://localhost:3000
      MARZPAY_API_KEY: ci-key
      MARZPAY_API_SECRET: ci-secret
      MARZPAY_BASE_URL: http://127.0.0.1:3999/api/v1
      MARZPAY_WEBHOOK_SECRET: ci-webhook-secret
      ADMIN_EMAIL: admin-ci@kuula.test
      ADMIN_PASSWORD: Admin-CI-Password-Only-2026
      DEMO_PHONE: "+256700000000"
      DEMO_PASSWORD: "12345678"
      DEMO_PIN: "7391"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm
        run: npm install --global npm@10.9.2 && test "$(npm --version)" = "10.9.2"
      - name: Repair server lock deterministically
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --before="$NPM_RESOLUTION_BEFORE" --no-audit --no-fund
      - name: Install API dependencies from resolved lock
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Upload resolved server lock
        uses: actions/upload-artifact@v4
        with:
          name: server-resolved-lock
          path: server/package-lock.json
          retention-days: 14
      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate
      - name: Build API
        working-directory: server
        run: npm run build
      - name: API unit tests
        working-directory: server
        run: npm test
      - name: Apply PostgreSQL migrations
        working-directory: server
        run: npm run db:migrate:deploy
      - name: Seed isolated CI database
        working-directory: server
        run: npm run db:seed
      - name: Hardened financial lifecycle
        working-directory: server
        env:
          TEST_OTP_CODE: "568921"
          SMS_PROVIDER: "test"
        run: |
          set -euo pipefail
          npx tsx src/test/fake-marzpay-server.ts &
          FAKE_PID=$!
          npm start &
          API_PID=$!
          trap 'kill $API_PID $FAKE_PID 2>/dev/null || true' EXIT

          ready=false
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then ready=true; break; fi
            sleep 0.5
          done
          test "$ready" = "true"

          ADMIN_JSON=$(curl -sf -X POST http://localhost:3000/api/auth/admin-login -H 'Content-Type: application/json' -d '{"email":"admin-ci@kuula.test","password":"Admin-CI-Password-Only-2026"}')
          ADMIN_TOKEN=$(echo "$ADMIN_JSON" | jq -r '.token')
          test -n "$ADMIN_TOKEN"
          ADMIN_TOKEN="$ADMIN_TOKEN" node src/test/manual-kyc-smoke.mjs

          # Loan, payout, repayments, callbacks, status lookups, fees and journals.
          node scripts/financial-lifecycle.mjs

  capacitor-sync:
    name: Capacitor Sync
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.2 && test "$(npm --version)" = "10.9.2"
      - run: npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/
      - name: Sync native projects
        run: npx cap sync android && npx cap sync ios
