name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_RESOLUTION_BEFORE: 2026-08-23T00:00:00.000Z

jobs:
  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify pinned npm
        run: test "$(npm --version)" = "10.9.2"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Resolve Pact workspace deterministically
        working-directory: pact
        env:
          PACT_DO_NOT_TRACK: "1"
        run: npm install --package-lock-only --ignore-scripts --before="$NPM_RESOLUTION_BEFORE" --no-audit --no-fund
      - name: Install Pact contract workspace from resolved lock
        working-directory: pact
        env:
          PACT_DO_NOT_TRACK: "1"
        run: npm ci --no-audit --no-fund
      - name: Pact consumer contracts
        working-directory: pact
        env:
          PACT_DO_NOT_TRACK: "1"
        run: npm test
      - name: Upload resolved Pact lock
        uses: actions/upload-artifact@v4
        with:
          name: pact-resolved-lock
          path: pact/package-lock.json
          retention-days: 14
      - name: Pricing compliance
        run: npm run check:pricing
      - name: Client-server pricing parity
        run: npm run check:pricing-parity
      - name: Guarded production build
        run: npm run build
        env:
          VITE_BACKEND: node
          VITE_USE_API: "true"
          VITE_API_BASE_URL: https://api-ci.kuula.invalid
          VITE_APP_ENV: production
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_ENABLE_BIOMETRIC: "true"
          VITE_REVIEWER_MODE: "false"
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7
      - name: Upload Pact contracts
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: pact/pacts/
          retention-days: 14
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Route sweep
        run: |
          npm run dev -- --port 5173 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:5173/ > /dev/null && break
            sleep 0.5
          done
          npm run sweep

  server:
    name: Node API + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kuula
          POSTGRES_PASSWORD: kuula
          POSTGRES_DB: kuula_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kuula -d kuula_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://kuula:kuula@localhost:5432/kuula_test?schema=public
      JWT_SECRET: ci-test-secret-at-least-64-characters-long-for-kuula-api
      OTP_PEPPER: ci-only-otp-pepper-at-least-32-characters
      NODE_ENV: test
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173
      PUBLIC_API_URL: http://localhost:3000
      MARZPAY_API_KEY: ci-key
      MARZPAY_API_SECRET: ci-secret
      MARZPAY_BASE_URL: http://127.0.0.1:3999/api/v1
      MARZPAY_WEBHOOK_SECRET: ci-webhook-secret
      ADMIN_EMAIL: admin-ci@kuula.test
      ADMIN_PASSWORD: Admin-CI-Password-Only-2026
      DEMO_PHONE: "+256700000000"
      DEMO_PASSWORD: "12345678"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify pinned npm
        run: test "$(npm --version)" = "10.9.2"
      - name: Repair server lock deterministically
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --before="$NPM_RESOLUTION_BEFORE" --no-audit --no-fund
      - name: Install API dependencies from resolved lock
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Upload resolved server lock
        uses: actions/upload-artifact@v4
        with:
          name: server-resolved-lock
          path: server/package-lock.json
          retention-days: 14
      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate
      - name: Build API
        working-directory: server
        run: npm run build
      - name: API unit tests
        working-directory: server
        run: npm test
      - name: Apply PostgreSQL migrations
        working-directory: server
        run: npm run db:migrate:deploy
      - name: Seed isolated CI database
        working-directory: server
        run: npm run db:seed
      - name: Hardened financial lifecycle
        working-directory: server
        run: |
          set -euo pipefail
          npx tsx src/test/fake-marzpay-server.ts &
          FAKE_PID=$!
          npm start &
          API_PID=$!
          trap 'kill $API_PID $FAKE_PID 2>/dev/null || true' EXIT

          ready=false
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then ready=true; break; fi
            sleep 0.5
          done
          test "$ready" = "true"

          CUSTOMER_JSON=$(curl -sf -X POST http://localhost:3000/api/auth/login -H 'Content-Type: application/json' -d '{"phone":"+256700000000","pin":"12345678"}')
          CUSTOMER_TOKEN=$(echo "$CUSTOMER_JSON" | jq -r '.token')
          CUSTOMER_REFRESH=$(echo "$CUSTOMER_JSON" | jq -r '.refreshToken')
          test -n "$CUSTOMER_TOKEN"
          test -n "$CUSTOMER_REFRESH"

          ADMIN_JSON=$(curl -sf -X POST http://localhost:3000/api/auth/admin-login -H 'Content-Type: application/json' -d '{"email":"admin-ci@kuula.test","password":"Admin-CI-Password-Only-2026"}')
          ADMIN_TOKEN=$(echo "$ADMIN_JSON" | jq -r '.token')
          test -n "$ADMIN_TOKEN"

          APPLICATION_JSON=$(curl -sf -X POST http://localhost:3000/api/loans/applications \
            -H "Authorization: Bearer $CUSTOMER_TOKEN" -H 'Content-Type: application/json' \
            -d '{"amount":100000,"purpose":"CI provider settlement","termDays":90,"channel":"MTN MoMo","declaredMonthlyIncome":1000000,"declaredMonthlyExpenses":250000,"existingDebtPayment":0}')
          APPLICATION_ID=$(echo "$APPLICATION_JSON" | jq -r '.application.id')
          test -n "$APPLICATION_ID"

          duplicate_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/loans/applications \
            -H "Authorization: Bearer $CUSTOMER_TOKEN" -H 'Content-Type: application/json' \
            -d '{"amount":100000,"purpose":"duplicate","termDays":90,"declaredMonthlyIncome":1000000,"declaredMonthlyExpenses":250000,"existingDebtPayment":0}')
          test "$duplicate_code" = "409"

          OFFER_JSON=$(curl -sf -X POST http://localhost:3000/api/loans/applications/decision \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"id\":\"$APPLICATION_ID\",\"decision\":\"approved\",\"notes\":\"CI approval after underwriting recheck\"}")
          test "$(echo "$OFFER_JSON" | jq -r '.application.status')" = "offered"

          no_agreement_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:3000/api/loans/$APPLICATION_ID/accept" -H "Authorization: Bearer $CUSTOMER_TOKEN")
          test "$no_agreement_code" = "409"

          AGREEMENT_JSON=$(curl -sf -X POST "http://localhost:3000/api/loans/$APPLICATION_ID/agreement/accept" \
            -H "Authorization: Bearer $CUSTOMER_TOKEN" -H 'Content-Type: application/json' \
            -d '{"clientContext":{"source":"ci"}}')
          test "$(echo "$AGREEMENT_JSON" | jq -r '.ok')" = "true"

          ACCEPT_JSON=$(curl -sf -X POST "http://localhost:3000/api/loans/$APPLICATION_ID/accept" -H "Authorization: Bearer $CUSTOMER_TOKEN")
          DISBURSEMENT_REF=$(echo "$ACCEPT_JSON" | jq -r '.disbursement.legs[0].reference')
          test -n "$DISBURSEMENT_REF"
          test "$DISBURSEMENT_REF" != "null"

          mismatch_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST 'http://localhost:3000/api/payments/marzpay/webhook?token=ci-webhook-secret' \
            -H 'Content-Type: application/json' \
            -d "{\"event_type\":\"disbursement.completed\",\"transaction\":{\"reference\":\"$DISBURSEMENT_REF\",\"status\":\"completed\",\"amount\":{\"raw\":99999}}}")
          test "$mismatch_code" = "409"

          blocked_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST 'http://localhost:3000/api/payments/marzpay/webhook?token=ci-webhook-secret' \
            -H 'Content-Type: application/json' \
            -d "{\"event_type\":\"disbursement.completed\",\"transaction\":{\"reference\":\"$DISBURSEMENT_REF\",\"status\":\"completed\",\"amount\":{\"raw\":100000}}}")
          test "$blocked_code" = "409"

          RECON_ID=$(DATABASE_URL="$DATABASE_URL" npx tsx -e 'import prisma from "./src/lib/prisma.ts"; const ref=process.argv[1]; const tx=await prisma.transaction.findUnique({where:{reference:ref}}); console.log(tx?.id||""); await prisma.$disconnect();' "$DISBURSEMENT_REF")
          test -n "$RECON_ID"

          curl -sf -X POST "http://localhost:3000/api/admin/reconciliation/$RECON_ID/review" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' \
            -d '{"note":"CI verified provider amount/reference before accepting replay"}' \
            | grep -q '"status":"reviewed"'

          curl -sf -X POST 'http://localhost:3000/api/payments/marzpay/webhook?token=ci-webhook-secret' \
            -H 'Content-Type: application/json' \
            -d "{\"event_type\":\"disbursement.completed\",\"transaction\":{\"reference\":\"$DISBURSEMENT_REF\",\"status\":\"completed\",\"amount\":{\"raw\":100000}}}" \
            | grep -q '"settled":true'

          STATUS_JSON=$(curl -sf "http://localhost:3000/api/loans/$APPLICATION_ID/disbursement" -H "Authorization: Bearer $CUSTOMER_TOKEN")
          test "$(echo "$STATUS_JSON" | jq -r '.disbursement.status')" = "settled"
          test "$(echo "$STATUS_JSON" | jq -r '.disbursement.totalSettled')" = "100000"

          PAYMENT_JSON=$(curl -sf -X POST http://localhost:3000/api/loans/repayment/pay -H "Authorization: Bearer $CUSTOMER_TOKEN" -H 'Content-Type: application/json' -d '{"amount":10000}')
          PAYMENT_REF=$(echo "$PAYMENT_JSON" | jq -r '.reference')
          test -n "$PAYMENT_REF"

          curl -sf -X POST 'http://localhost:3000/api/payments/marzpay/webhook?token=ci-webhook-secret' \
            -H 'Content-Type: application/json' \
            -d "{\"event_type\":\"collection.completed\",\"transaction\":{\"uuid\":\"provider-collection\",\"reference\":\"$PAYMENT_REF\",\"status\":\"completed\",\"amount\":{\"raw\":10000}}}" \
            | grep -q '"settled":true'

          AFTER_PAYMENT=$(curl -sf http://localhost:3000/api/loans/repayment -H "Authorization: Bearer $CUSTOMER_TOKEN")
          test "$(echo "$AFTER_PAYMENT" | jq -r '.repayment.amount_paid')" = "10000"

          JOURNAL_COUNT=$(DATABASE_URL="$DATABASE_URL" npx tsx -e 'import prisma from "./src/lib/prisma.ts"; console.log(await prisma.journal.count()); await prisma.$disconnect();')
          test "$JOURNAL_COUNT" -ge 2

  capacitor-sync:
    name: Capacitor Sync
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify pinned npm
        run: test "$(npm --version)" = "10.9.2"
      - run: npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/
      - name: Sync native projects
        run: npx cap sync android && npx cap sync ios
