name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend: typecheck + pricing compliance + build + API smoke + sweep ─────
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Pricing compliance (Apple 36% + UMRA 33.6% APR caps)
        run: node scripts/check-pricing-compliance.mjs

      - name: Frontend unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Route sweep (all screens, runtime errors + blank pages)
        run: |
          npm run dev -- --port 5173 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:5173/ > /dev/null && break
            sleep 0.5
          done
          npm run sweep

  # ── Backend: typecheck + Postgres-backed test suite ──────────────────────────
  # These tests run against a REAL PostgreSQL service. The financial guarantees
  # they verify (row locks, partial unique indexes, CHECK constraints) do not
  # exist in a mock, so this job must never be switched to an in-memory double.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kuula
          POSTGRES_PASSWORD: kuula
          POSTGRES_DB: kuula_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuula -d kuula_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgres://kuula:kuula@localhost:5432/kuula_test
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-at-least-32-characters-long-please
      OTP_PEPPER: ci-test-pepper-at-least-32-characters-long-please
      SMS_PROVIDER: log
      MARZPAY_API_KEY: ci-test-key
      MARZPAY_API_SECRET: ci-test-secret
      MARZPAY_WEBHOOK_SECRET: test-webhook-secret
      MARZPAY_WEBHOOK_MODE: hmac
      MARZPAY_VERIFY_CALLBACKS: "false"
      PUBLIC_API_BASE_URL: https://test.kuula.local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci && npm ci --prefix server

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Typecheck backend
        working-directory: server
        run: npm run typecheck

      - name: Run migrations
        working-directory: server
        run: npx prisma migrate deploy

      # The suite reads .env.test; in CI the values above already point at the
      # service container, so we materialise a matching file.
      - name: Write test env
        working-directory: server
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "NODE_ENV=test"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "OTP_PEPPER=$OTP_PEPPER"
            echo "SMS_PROVIDER=$SMS_PROVIDER"
            echo "MARZPAY_API_KEY=$MARZPAY_API_KEY"
            echo "MARZPAY_API_SECRET=$MARZPAY_API_SECRET"
            echo "MARZPAY_WEBHOOK_SECRET=$MARZPAY_WEBHOOK_SECRET"
            echo "MARZPAY_WEBHOOK_MODE=$MARZPAY_WEBHOOK_MODE"
            echo "MARZPAY_VERIFY_CALLBACKS=$MARZPAY_VERIFY_CALLBACKS"
            echo "PUBLIC_API_BASE_URL=$PUBLIC_API_BASE_URL"
          } > .env.test

      - name: Run backend tests (disbursement, repayment, webhook, auth, concurrency)
        working-directory: server
        run: npm test

  # ── Capacitor sync sanity (web build → native projects) ─────────────────────
  sync:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync native projects
        run: npx cap sync android && npx cap sync ios
