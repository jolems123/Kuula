name: Refresh Locked Web Dependencies
on:
  push:
    branches: [test/full-app-api-dependency-audit]
    paths:
      - package.json
      - .github/workflows/refresh-web-lock.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/full-app-api-dependency-audit
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@10.9.2
      - name: Refresh safe dependency resolutions and lock
        run: |
          npm update --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Validate lock before committing
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Commit lock only
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): refresh patched web dependency lock"
            git push origin HEAD:test/full-app-api-dependency-audit
          fi
