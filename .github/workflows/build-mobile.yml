# Build & verify web bundle + native mobile apps (Capacitor)
#
# Three modes:
#   push to main       → CI only (typecheck + build + test + pricing check)
#   workflow_dispatch  → CI + Android APK/AAB and/or iOS IPA
#
# build_type options:
#   debug   → unsigned APK (install directly on phone, no secrets needed)
#   release → signed AAB for Play Store (requires ANDROID_* secrets)
#
# For quick phone testing: Run workflow → build_type=debug → download APK artifact.
name: Build Mobile Apps

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated)"
        required: false
        default: "android"
        type: string
      build_type:
        description: "debug = APK for testing (no secrets). release = signed AAB for Play Store."
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  VITE_BACKEND: supabase
  VITE_USE_API: "true"
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_APP_ENV: production
  VITE_APP_VERSION: "2.4.1"
  VITE_ENABLE_BIOMETRIC: "true"
  VITE_ENABLE_SAVINGS: "true"
  VITE_REVIEWER_MODE: "false"

jobs:
  # ── Job 1: Verify (always runs) ─────────────────────────────────────────
  verify:
    name: Typecheck + Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Pricing compliance
        run: node scripts/check-pricing-compliance.mjs

      - name: Production build
        run: npx vite build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # ── Job 2: Android — debug APK or signed release AAB ─────────────────
  android:
    name: "Android (${{ github.event.inputs.build_type || 'debug' }})"
    needs: verify
    if: github.event_name == 'workflow_dispatch' && contains(github.event.inputs.platforms || 'android', 'android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci --legacy-peer-deps

      - name: Download web dist from verify job
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Sync to Android
        run: npx cap sync android

      # ── Debug: unsigned APK (no secrets needed, install directly on phone) ──
      - name: Build debug APK
        if: github.event.inputs.build_type == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: github.event.inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ── Release: signed AAB (requires ANDROID_* secrets) ──
      - name: Decode keystore
        if: github.event.inputs.build_type == 'release'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/kuula-release.keystore

      - name: Build signed release AAB
        if: github.event.inputs.build_type == 'release'
        working-directory: android
        env:
          KUULA_RELEASE_STORE_FILE: kuula-release.keystore
          KUULA_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KUULA_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KUULA_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload release AAB
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  # ── Job 3: iOS signed IPA (manual trigger only, Mac only) ──────────────
  ios:
    name: Build iOS IPA
    needs: verify
    if: github.event_name == 'workflow_dispatch' && contains(github.event.inputs.platforms || 'android', 'ios')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Download web dist from verify job
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Sync to iOS
        run: npx cap sync ios

      - name: Decode certificates
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_CERT_BASE64 }}" | base64 -d > certs.p12
          echo "${{ secrets.APPLE_PROVISION_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/Kuula.mobileprovision

      - name: Build IPA
        working-directory: ios/App
        env:
          EXPORT_METHOD: app-store
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -archivePath build/App.xcarchive \
            archive CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportPath build/ipa -exportOptionsPlist /dev/stdin <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict><key>method</key><string>app-store</string></dict>
          </plist>
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/App/build/ipa/*.ipa
          retention-days: 30