# Build verified Capacitor applications on demand.
#
# Production architecture:
#   React/Capacitor client -> Node/Express API -> PostgreSQL (managed with pgAdmin)
#
# Pull requests and pushes are verified by ci.yml. This workflow is deliberately
# manual so it only consumes Android/iOS build resources when an artifact is needed.
name: Build Mobile Apps

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated)"
        required: false
        default: "android"
        type: string
      build_type:
        description: "debug = APK for testing. release = signed AAB for Play Store."
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  VITE_BACKEND: node
  VITE_USE_API: "true"
  VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
  VITE_APP_ENV: production
  VITE_APP_VERSION: "2.4.1"
  VITE_ENABLE_BIOMETRIC: "true"
  VITE_ENABLE_SAVINGS: "true"
  VITE_REVIEWER_MODE: "false"

jobs:
  verify:
    name: Frontend + Server Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Frontend TypeScript check
        run: npm run typecheck

      - name: Frontend unit tests
        run: npm test

      - name: Pricing compliance
        run: npm run check:pricing

      - name: Server TypeScript build
        working-directory: server
        run: npm run build

      - name: Production web build
        run: npm run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  android:
    name: "Android (${{ github.event.inputs.build_type || 'debug' }})"
    needs: verify
    if: contains(github.event.inputs.platforms || 'android', 'android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci --legacy-peer-deps

      - name: Download verified web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Sync to Android
        run: npx cap sync android

      - name: Build debug APK
        if: github.event.inputs.build_type == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: github.event.inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Decode release keystore
        if: github.event.inputs.build_type == 'release'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/kuula-release.keystore

      - name: Build signed release AAB
        if: github.event.inputs.build_type == 'release'
        working-directory: android
        env:
          KUULA_RELEASE_STORE_FILE: kuula-release.keystore
          KUULA_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KUULA_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KUULA_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload release AAB
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  ios:
    name: Build iOS IPA
    needs: verify
    if: contains(github.event.inputs.platforms || 'android', 'ios')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Download verified web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Sync to iOS
        run: npx cap sync ios

      - name: Decode certificates
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_CERT_BASE64 }}" | base64 -d > certs.p12
          echo "${{ secrets.APPLE_PROVISION_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/Kuula.mobileprovision

      - name: Build IPA
        working-directory: ios/App
        env:
          EXPORT_METHOD: app-store
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -archivePath build/App.xcarchive \
            archive CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportPath build/ipa -exportOptionsPlist /dev/stdin <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict><key>method</key><string>app-store</string></dict>
          </plist>
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/App/build/ipa/*.ipa
          retention-days: 30