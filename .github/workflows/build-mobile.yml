# Build & verify web bundle + native mobile apps (Capacitor)
#
# Two modes:
#   push to main  → CI only (typecheck + build + test + pricing check)
#   workflow_dispatch → CI + signed Android AAB / iOS IPA for store upload
#
# Requires GitHub Secrets for signed builds (see SECRETS.md reference below).
name: Build Mobile Apps

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated)"
        required: false
        default: "android"
        type: string
      build_type:
        description: "Build type"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

env:
  VITE_BACKEND: supabase
  VITE_USE_API: "true"
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_APP_ENV: production
  VITE_APP_VERSION: "2.4.1"
  VITE_ENABLE_BIOMETRIC: "true"
  VITE_ENABLE_SAVINGS: "true"
  VITE_REVIEWER_MODE: "false"

jobs:
  # ── Job 1: Verify (always runs) ─────────────────────────────────────────
  verify:
    name: Typecheck + Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Pricing compliance
        run: node scripts/check-pricing-compliance.mjs

      - name: Production build
        run: npx vite build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # ── Job 2: Android signed AAB (manual trigger only) ────────────────────
  android:
    name: Build Android AAB
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci --legacy-peer-deps

      - name: Build web + sync to Android
        run: npx cap sync android

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/kuula-release.keystore

      - name: Build signed AAB
        working-directory: android
        env:
          KUULA_RELEASE_STORE_FILE: kuula-release.keystore
          KUULA_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KUULA_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KUULA_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  # ── Job 3: iOS signed IPA (manual trigger only, Mac only) ──────────────
  ios:
    name: Build iOS IPA
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Build web + sync to iOS
        run: npx cap sync ios

      - name: Decode certificates
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_CERT_BASE64 }}" | base64 -d > certs.p12
          echo "${{ secrets.APPLE_PROVISION_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/Kuula.mobileprovision

      - name: Build IPA
        working-directory: ios/App
        env:
          EXPORT_METHOD: app-store
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -archivePath build/App.xcarchive \
            archive CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportPath build/ipa -exportOptionsPlist /dev/stdin <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict><key>method</key><string>app-store</string></dict>
          </plist>
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/App/build/ipa/*.ipa
          retention-days: 30