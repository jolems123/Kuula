name: Build Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_USE_API: "false"
          VITE_BACKEND: supabase
          VITE_APP_ENV: production
          VITE_APP_VERSION: ${{ github.sha }}
      - run: npm test
      - run: npm run check:pricing