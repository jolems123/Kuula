name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy all Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy \
            --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify deployments
        run: |
          BASE="https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1"
          for fn in marzpay-collect marzpay-disburse marzpay-webhook credit-score auto-collect; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/$fn" -H "Content-Type: application/json" -d '{}')
            if [ "$STATUS" = "404" ]; then
              echo "FAIL: $fn returned 404 (not deployed)"
              exit 1
            else
              echo "OK:   $fn → $STATUS"
            fi
          done
