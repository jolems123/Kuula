name: Deploy Node API

# Builds the active Node/Express API from server/.
# Pull requests build and validate the image without publishing it.
# Version tags and manual runs publish to GHCR and deploy to production.

on:
  pull_request:
    paths:
      - "server/**"
      - "deploy/**"
      - ".github/workflows/deploy-backend.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (defaults to the current git SHA)"
        required: false
        default: ""

concurrency:
  group: deploy-node-api-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kuula-api

jobs:
  build-and-push:
    name: Build Node API image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Set image tag
        id: image
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.title=Kuula Node API
            org.opencontainers.image.description=Kuula Microfinance Node.js and Express API backed by PostgreSQL
          annotations: |
            org.opencontainers.image.title=Kuula Node API
            org.opencontainers.image.description=Kuula Microfinance Node.js and Express API backed by PostgreSQL

      - name: Build and optionally push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false

      - name: Build summary
        run: |
          echo "### Kuula Node API image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ steps.image.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published: \`${{ github.event_name != 'pull_request' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.docker_build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy production API
    if: github.event_name != 'pull_request'
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://api.kuula.ug
    steps:
      - uses: actions/checkout@v5

      - name: Install SSH key
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Prepare production directory
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p /opt/kuula"

      - name: Copy production compose file
        run: |
          scp -i ~/.ssh/deploy_key \
            deploy/docker-compose.prod.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/kuula/docker-compose.yml"

      - name: Pull, migrate, and deploy image
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e; \
             cd /opt/kuula; \
             export KUULA_IMAGE='${REGISTRY}/${IMAGE_NAME}'; \
             export KUULA_IMAGE_TAG='${IMAGE_TAG}'; \
             docker compose --env-file .env pull api; \
             echo 'Applying Prisma migrations before API rollout'; \
             docker compose --env-file .env run --rm --no-deps api npx prisma migrate deploy; \
             docker compose --env-file .env up -d --remove-orphans api; \
             for i in \$(seq 1 30); do \
               if curl -sf http://127.0.0.1:3000/api/health | grep -q '\"ok\":true'; then exit 0; fi; \
               sleep 2; \
             done; \
             docker compose logs --tail=100 api; \
             exit 1"

      - name: Verify public health
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_API_URL || 'https://api.kuula.ug' }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf "$PUBLIC_URL/api/health" | grep -q '"ok":true'; then
              echo "Production health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Production health check failed"
          exit 1

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
