name: Build Node API

# Railway is the single production deployment authority.
# This workflow validates the backend container and can publish versioned images
# to GHCR, but it intentionally does not SSH to or mutate production hosts.

on:
  pull_request:
    paths:
      - "server/**"
      - "deploy/**"
      - ".github/workflows/deploy-backend.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the current git SHA)"
        required: false
        default: ""

concurrency:
  group: build-node-api-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kuula-api

jobs:
  build-and-push:
    name: Build Node API image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set image tag
        id: image
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.title=Kuula Node API
            org.opencontainers.image.description=Kuula Microfinance Node.js and Express API backed by PostgreSQL

      - name: Build and optionally publish
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false

      - name: Build summary
        run: |
          echo "### Kuula Node API image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ steps.image.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published: \`${{ github.event_name != 'pull_request' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.docker_build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production deployment: Railway only" >> "$GITHUB_STEP_SUMMARY"
