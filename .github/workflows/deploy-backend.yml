name: Deploy Backend

# Auto-deploys the backend to production on every tag push matching `v*`
# (e.g. `v2.4.2`). Manual trigger is also available for redeploys without
# cutting a new tag.
#
# Pipeline:
#   1. Build the Docker image from backend/Dockerfile.
#   2. Push to GitHub Container Registry (ghcr.io/<org>/kuula-api:<tag>).
#   3. SSH into the production host, pull the new image, and restart the
#      docker-compose stack with the new tag.
#
# The deploy is atomic: docker-compose pulls the new image, recreates the
# `api` container, and waits for the healthcheck. If the new container
# fails to come up, docker-compose rolls back to the previous image.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (defaults to the latest git SHA)"
        required: false
        default: ""

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kuula-api

jobs:
  # ── Build + push image to GHCR ─────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_ref: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "tags=$REGISTRY/$IMAGE_NAME:$TAG,$REGISTRY/$IMAGE_NAME:latest" >> $GITHUB_OUTPUT
          echo "Deploying image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend metadata
        id: extract
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.extract.outputs.tags }}
          labels: ${{ steps.extract.outputs.labels }}
          # Cache across runs for faster builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false

      - name: Summary
        run: |
          echo "### Backend image pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "Image: $REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Digest: ${{ steps.docker_build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ── Deploy to production host via SSH ──────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      # GitHub will wait for a manual approval here if you enable required
      # reviewers on the `production` environment in repo settings.
      url: https://api.kuula.ug
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy production compose file to server
        run: |
          scp -i ~/.ssh/deploy_key \
            deploy/docker-compose.prod.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/kuula/docker-compose.yml

      - name: Deploy on server
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /opt/kuula && \
             export KUULA_IMAGE_TAG=$IMAGE_REF && \
             docker compose --env-file .env pull api && \
             docker compose --env-file .env up -d api && \
             sleep 5 && \
             for i in \$(seq 1 30); do \
               curl -sf http://localhost:3000/api/health && break; \
               sleep 2; \
             done && \
             docker image prune -f"

      - name: Verify health
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_API_URL || 'https://api.kuula.ug' }}
        run: |
          sleep 10
          for i in $(seq 1 30); do
            if curl -sf "$PUBLIC_URL/api/health" | grep -q '"ok":true'; then
              echo "✅ Production health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Health check failed after 150s — investigate via SSH"
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
