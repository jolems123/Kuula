version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Kampala
    open-pull-requests-limit: 10
    groups:
      frontend-runtime:
        dependency-type: production
      frontend-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Africa/Kampala
    open-pull-requests-limit: 10
    groups:
      api-runtime:
        dependency-type: production
      api-development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Africa/Kampala
    open-pull-requests-limit: 5
