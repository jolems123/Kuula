# ─────────────────────────────────────────────────────────────────────────────
# Kuula backend local stack: Postgres + API.
#
#   docker compose up -d             # start postgres + api
#   docker compose logs -f api
#   docker compose down              # stop (data persists in volume)
#   docker compose down -v           # stop + wipe data
# ─────────────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    container_name: kuula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuula
      POSTGRES_PASSWORD: kuula
      POSTGRES_DB: kuula
    ports:
      - "5432:5432"
    volumes:
      - kuula_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuula -d kuula"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    container_name: kuula-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://kuula:kuula@postgres:5432/kuula
      AUTO_MIGRATE: "true"
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32chars-min}
      JWT_ISSUOR: kuula-api
      JWT_AUDIENCE: kuula-app
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:4173,capacitor://localhost}
      DEBUG_OTP: "true"
      LOG_LEVEL: info
    ports:
      - "3000:3000"

volumes:
  kuula_pgdata:
