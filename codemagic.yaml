workflows:
  kuula-android-production:
    name: Kuula Android Production
    instance_type: linux_x2
    max_build_duration: 90
    environment:
      groups:
        # Create this group in Codemagic and add VITE_API_BASE_URL only.
        # Browser/mobile variables are public; never put server secrets in it.
        - kuula_production
      android_signing:
        # Upload the Android release keystore in Codemagic Code signing identities
        # with this exact reference name.
        - kuula_android_release
      vars:
        VITE_BACKEND: node
        VITE_USE_API: "true"
        VITE_APP_ENV: production
        VITE_ENABLE_BIOMETRIC: "true"
        VITE_REVIEWER_MODE: "false"
        VITE_ENABLE_SAVINGS: "false"
        VITE_ENABLE_INVESTMENTS: "false"
        VITE_ENABLE_AUTOPAY: "false"
        VITE_ENABLE_CREDIT_BUILDER: "false"
        PACT_DO_NOT_TRACK: "1"
        NPM_RESOLUTION_BEFORE: "2026-08-23T00:00:00.000Z"
      node: 22
      npm: 10.9.2
      java: 21
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Verify production mobile environment
        script: |
          test -n "$VITE_API_BASE_URL"
          node --version
          npm --version
          java -version
          npm run check:env

      - name: Install application dependencies
        script: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        script: npm run typecheck

      - name: Unit tests
        script: npm test

      - name: Pact consumer contracts
        script: |
          cd pact
          npm install --package-lock-only --ignore-scripts --before="$NPM_RESOLUTION_BEFORE" --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm test

      - name: Financial pricing checks
        script: |
          npm run check:pricing
          npm run check:pricing-parity

      - name: Build production web bundle
        script: npm run build

      - name: Sync Capacitor Android
        script: npx cap sync android

      - name: Configure Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build signed Android APK and AAB
        script: |
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
      - pact/pacts/*.json

  kuula-ios-production:
    name: Kuula iOS Production
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        # Same public production variables as Android. VITE_API_BASE_URL is
        # required. Do not add DATABASE_URL, JWT, MarZPay, KYC or S3 secrets.
        - kuula_production
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ug.kuula.app
      vars:
        VITE_BACKEND: node
        VITE_USE_API: "true"
        VITE_APP_ENV: production
        VITE_ENABLE_BIOMETRIC: "true"
        VITE_REVIEWER_MODE: "false"
        VITE_ENABLE_SAVINGS: "false"
        VITE_ENABLE_INVESTMENTS: "false"
        VITE_ENABLE_AUTOPAY: "false"
        VITE_ENABLE_CREDIT_BUILDER: "false"
        PACT_DO_NOT_TRACK: "1"
        NPM_RESOLUTION_BEFORE: "2026-08-23T00:00:00.000Z"
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 22
      npm: 10.9.2
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.cocoapods
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Verify production mobile environment
        script: |
          test -n "$VITE_API_BASE_URL"
          node --version
          npm --version
          xcodebuild -version
          npm run check:env

      - name: Install application dependencies
        script: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        script: npm run typecheck

      - name: Unit tests
        script: npm test

      - name: Pact consumer contracts
        script: |
          cd pact
          npm install --package-lock-only --ignore-scripts --before="$NPM_RESOLUTION_BEFORE" --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm test

      - name: Financial pricing checks
        script: |
          npm run check:pricing
          npm run check:pricing-parity

      - name: Build production web bundle
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Set iOS build number
        script: |
          BUILD_NUMBER=$((24100 + CM_BUILD_NUMBER))
          /usr/bin/sed -i '' -E \
            "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" \
            ios/App/App.xcodeproj/project.pbxproj
          grep "CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};" ios/App/App.xcodeproj/project.pbxproj

      - name: Apply iOS signing profiles
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - pact/pacts/*.json
